<?xml version="1.0" encoding="UTF-8"?>
<!-- The Learning Dojo: Animals, Volume 1 — KDP full-wrap paperback cover template.
     Trim 8.5 x 11 in, 34 pages on white paper, spine 34 x 0.002252 = 0.0766 in, bleed 0.125 in each side.
     Document size 17.3266 x 11.25 in (96 px per inch). Export PDF at 300 dpi with text converted to paths.
     Fonts match the interior: Lilita One (title, outlined), Chewy (subtitle), Sacramento (author). -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="17.3266in" height="11.25in" viewBox="0 0 1663.35 1080.0">
  <g inkscape:groupmode="layer" inkscape:label="Background (extend to bleed)">
    <rect x="0" y="0" width="1663.35" height="1080.0" fill="#ffffff"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Art">
    <!-- cover art goes here; let it run to the outer edge of the bleed -->
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Text">
    <text x="1243.35" y="223.2" text-anchor="middle" font-family="'Lilita One'" font-size="120" fill="#ffffff" stroke="#111111" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill">The Learning Dojo</text>
    <text x="1243.35" y="300.0" text-anchor="middle" font-family="Chewy" font-size="56" fill="#ffffff" stroke="#111111" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">Animals · Volume 1</text>
    <text x="1243.35" y="981.6" text-anchor="middle" font-family="Sacramento" font-size="72" fill="#111111">Swan Moon</text>
    <text x="420.0" y="165.6" text-anchor="middle" font-family="Fredoka" font-weight="600" font-size="44" fill="#111111">Back-cover blurb</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="GUIDES — delete before export" inkscape:locked="true">
    <!-- trim lines -->
    <rect x="12.0" y="12.0" width="1639.35" height="1056" fill="none" stroke="#ff00ff" stroke-width="1" stroke-dasharray="6 4"/>
    <!-- spine -->
    <rect x="828.0" y="12.0" width="7.35" height="1056" fill="none" stroke="#00aaff" stroke-width="1"/>
    <!-- safe zones (keep text and important art inside) -->
    <rect x="36.0" y="36.0" width="768.0" height="1008.0" fill="none" stroke="#00cc66" stroke-width="1" stroke-dasharray="3 3"/>
    <rect x="859.35" y="36.0" width="768.0" height="1008.0" fill="none" stroke="#00cc66" stroke-width="1" stroke-dasharray="3 3"/>
    <!-- KDP barcode area: 2 x 1.2 in, 0.25 in from the bottom-right trim corner of the BACK cover -->
    <rect x="612.0" y="928.8" width="192" height="115.2" fill="#ffffff" stroke="#ff8800" stroke-width="1"/>
    <text x="708.0" y="996.0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ff8800">barcode (KDP adds it)</text>
    <text x="40.8" y="60.0" font-family="sans-serif" font-size="14" fill="#ff00ff">BACK</text>
    <text x="864.15" y="60.0" font-family="sans-serif" font-size="14" fill="#ff00ff">FRONT</text>
  </g>
</svg>
