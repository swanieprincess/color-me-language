<?xml version="1.0" encoding="UTF-8"?>
<!-- Glyph template for build_font.py.
     Units: 1000 per em. The page is 1000 tall; the baseline is 800 from the top.
     Cap height 700, x-height 500, ascender 750, descender -200 (standard proportions).
     The PAGE WIDTH is the advance width of the letter: leave the gap you want
     on each side of the drawing, then drag the page width (Document Properties)
     or Edit > Resize Page to Selection and add equal margins.
     Draw on the "Glyph" layer only. The GUIDES layer is ignored by the build. -->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     width="600" height="1000" viewBox="0 0 600 1000">
  <sodipodi:namedview id="namedview" showguides="true" inkscape:document-units="px"
      inkscape:current-layer="layerGlyph" bordercolor="#666666" pagecolor="#ffffff">
    <sodipodi:guide position="0,200" orientation="0,1" inkscape:label="baseline"   inkscape:color="#ff0000"/>
    <sodipodi:guide position="0,900" orientation="0,1" inkscape:label="cap height" inkscape:color="#0066ff"/>
    <sodipodi:guide position="0,950" orientation="0,1" inkscape:label="ascender"   inkscape:color="#0066ff"/>
    <sodipodi:guide position="0,700" orientation="0,1" inkscape:label="x-height"   inkscape:color="#00aa44"/>
    <sodipodi:guide position="0,0"   orientation="0,1" inkscape:label="descender"  inkscape:color="#ff8800"/>
  </sodipodi:namedview>
  <g inkscape:groupmode="layer" id="GUIDES" inkscape:label="GUIDES (ignored by the build)" sodipodi:insensitive="true">
    <rect x="0" y="0" width="600" height="1000" fill="#ffffff"/>
    <line x1="0" y1="800" x2="600" y2="800" stroke="#ff0000" stroke-width="2"/>
    <line x1="0" y1="100" x2="600" y2="100" stroke="#0066ff" stroke-width="1" stroke-dasharray="8 6"/>
    <line x1="0" y1="50"  x2="600" y2="50"  stroke="#0066ff" stroke-width="1" stroke-dasharray="2 6"/>
    <line x1="0" y1="300" x2="600" y2="300" stroke="#00aa44" stroke-width="1" stroke-dasharray="8 6"/>
    <line x1="0" y1="999" x2="600" y2="999" stroke="#ff8800" stroke-width="2"/>
    <text x="6" y="794" font-family="sans-serif" font-size="22" fill="#ff0000">baseline 0</text>
    <text x="6" y="94"  font-family="sans-serif" font-size="22" fill="#0066ff">cap height 700</text>
    <text x="6" y="44"  font-family="sans-serif" font-size="18" fill="#0066ff">ascender 750</text>
    <text x="6" y="294" font-family="sans-serif" font-size="22" fill="#00aa44">x-height 500</text>
    <text x="6" y="990" font-family="sans-serif" font-size="22" fill="#ff8800">descender -200</text>
    <text x="594" y="30" text-anchor="end" font-family="sans-serif" font-size="28" fill="#999999">p  (p)</text>
  </g>
  <g inkscape:groupmode="layer" id="layerGlyph" inkscape:label="Glyph">
    <!-- draw the letter here as filled black shapes -->
  </g>
</svg>
